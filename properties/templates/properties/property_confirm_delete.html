{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h3>Confirmer la suppression</h3>
  <p>Supprimer <strong>{{ property.title }}</strong> ?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url 'properties:property_list' %}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
